<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #030506; stroke: #1C2927; stroke-width: 1.5; rx: 6; ry: 6; }
      .box { fill: #10161a; stroke: #3e4a5c; stroke-width: 1.5; rx: 4; ry: 4; }
      .box-core { fill: #111a18; stroke: #20B96B; stroke-width: 2; rx: 6; ry: 6; }
      .text-title { font-family: Inter, Segoe UI, sans-serif; font-size: 14px; font-weight: bold; fill: #F7F9FA; text-anchor: middle; }
      .text-body { font-family: Inter, Segoe UI, sans-serif; font-size: 11px; fill: #aab3ba; text-anchor: middle; }
      .text-body-core { font-family: Inter, Segoe UI, sans-serif; font-size: 11px; fill: #65D83B; font-weight: bold; text-anchor: middle; }
      .line-connector { stroke: #1C2927; stroke-width: 2; fill: none; }
      .line-glow { stroke: #20B96B; stroke-width: 1.5; fill: none; opacity: 0.5; }
    </style>
  </defs>

  <rect class="bg" width="800" height="240" />

  <!-- Core Package -->
  <g transform="translate(310, 20)">
    <rect class="box-core" width="180" height="70" />
    <text class="text-title" fill="#65D83B" x="90" y="32">tracegc</text>
    <text class="text-body-core" x="90" y="52">Core Compaction Engine</text>
  </g>

  <!-- Connectors -->
  <!-- Main stem down -->
  <path class="line-connector" d="M 400,90 L 400,130" />
  <path class="line-glow" d="M 400,90 L 400,130" />

  <!-- Horizontal bar -->
  <path class="line-connector" d="M 170,130 L 630,130" />
  <path class="line-glow" d="M 170,130 L 630,130" />

  <!-- Drop lines -->
  <path class="line-connector" d="M 170,130 L 170,160" />
  <path class="line-connector" d="M 400,130 L 400,160" />
  <path class="line-connector" d="M 630,130 L 630,160" />

  <!-- Leaf Packages -->
  <!-- Left: Storage -->
  <g transform="translate(80, 160)">
    <rect class="box" width="180" height="60" />
    <text class="text-title" x="90" y="28">tracegc-storage</text>
    <text class="text-body" x="90" y="44">In-Memory &amp; SQLite</text>
  </g>

  <!-- Middle: MCP -->
  <g transform="translate(310, 160)">
    <rect class="box" width="180" height="60" />
    <text class="text-title" x="90" y="28">tracegc-mcp</text>
    <text class="text-body" x="90" y="44">Model Context Protocol</text>
  </g>

  <!-- Right: Adapters -->
  <g transform="translate(540, 160)">
    <rect class="box" width="180" height="60" />
    <text class="text-title" x="90" y="28">Framework Adapters</text>
    <text class="text-body" x="90" y="44">LangGraph &amp; CrewAI</text>
  </g>
</svg>
