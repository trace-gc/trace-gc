<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #030506; stroke: #1C2927; rx: 6; ry: 6; }
      .box { stroke: #1d2d2a; stroke-width: 1.5; rx: 4; ry: 4; }
      .text-title { font-family: Inter, Segoe UI, sans-serif; font-size: 14px; font-weight: bold; fill: #F7F9FA; }
      .code-text { font-family: Courier New, monospace; font-size: 11px; }
      .recovery-arrow { stroke: #24E5D7; stroke-width: 2; fill: none; stroke-dasharray: 6; animation: dash 3s linear infinite; }
      .recovered-box { animation: recoverStep 6s infinite; }

      @keyframes dash {
        to { stroke-dashoffset: -20; }
      }

      @keyframes recoverStep {
        0%, 30% { opacity: 0; transform: translateX(-15px); }
        45%, 85% { opacity: 1; transform: translateX(0); }
        95%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="bg" width="800" height="240" />

  <!-- Left Side: Active Context -->
  <g transform="translate(30, 30)">
    <rect class="box" fill="#10161a" width="220" height="180" />
    <text class="text-title" x="15" y="25">Active Context</text>
    
    <g transform="translate(15, 45)">
      <rect fill="#15211e" stroke="#20B96B" width="190" height="28" rx="2" />
      <text class="code-text" fill="#65D83B" x="10" y="18">[e001] User Request</text>
    </g>
    
    <g transform="translate(15, 83)">
      <rect fill="#0a1518" stroke="#24E5D7" width="190" height="28" rx="2" />
      <text class="code-text" fill="#24E5D7" x="10" y="18">[RECEIPT e002] x=10</text>
    </g>
    
    <g transform="translate(15, 121)">
      <rect fill="#15211e" stroke="#20B96B" width="190" height="28" rx="2" />
      <text class="code-text" fill="#65D83B" x="10" y="18">[e003] set_var x=20</text>
    </g>
  </g>

  <!-- Connective Path / Recovery Action -->
  <path class="recovery-arrow" d="M 235,128 L 385,128" />
  <circle cx="235" cy="128" r="4" fill="#24E5D7" />
  <polygon points="385,124 395,128 385,132" fill="#24E5D7" />
  <text font-family="Inter, Segoe UI, sans-serif" font-size="11px" font-weight="bold" fill="#24E5D7" x="250" y="115">client.get_receipt("e002")</text>

  <!-- Right Side: Recovered Original Event Payload -->
  <g class="recovered-box" transform="translate(420, 30)">
    <rect class="box" fill="#10161a" width="350" height="180" />
    <text class="text-title" x="20" y="25">Recovered Event Payload</text>

    <!-- JSON Representation -->
    <text class="code-text" fill="#24E5D7" x="20" y="55">
      <tspan x="20" dy="0">{</tspan>
      <tspan x="40" dy="18">"id": "e002",</tspan>
      <tspan x="40" dy="18">"type": "set_var",</tspan>
      <tspan x="40" dy="18">"timestamp": 1010,</tspan>
      <tspan x="40" dy="18">"key": "x",</tspan>
      <tspan x="40" dy="18">"value": 10,</tspan>
      <tspan x="40" dy="18">"pruned": true</tspan>
      <tspan x="20" dy="18">}</tspan>
    </text>
  </g>
</svg>
