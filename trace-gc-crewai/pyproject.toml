[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-gc-crewai"
version = "0.1.0"
description = "CrewAI adapter for trace-gc context compaction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "trace-gc"
]

[project.optional-dependencies]
test = [
    "pytest",
    "crewai"
]
