[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracegc-crewai"
version = "0.1.0"
description = "CrewAI adapter for tracegc context compaction"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "tracegc"
]

[project.optional-dependencies]
test = [
    "pytest",
    "crewai"
]
